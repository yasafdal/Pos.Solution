
name: AgresPOS UAT - Compare Existing Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare:
    name: Compare latest master build with UAT
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, agrespos-uat]
    timeout-minutes: 20

    steps:
      - name: Checkout current master (no build)
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Find latest successful master build
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'uat-build.yml',
              branch: 'master',
              status: 'completed',
              per_page: 100
            });

            const latest = data.workflow_runs.find(
              run => run.conclusion === 'success' &&
                     run.head_branch === 'master'
            );

            if (!latest) {
              core.setFailed('No successful master build was found.');
              return;
            }

            const artifactName =
              `AgresPOS-UAT-publish-${latest.head_sha}`;

            const { data: artifacts } =
              await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: latest.id,
                per_page: 100
              });

            const artifact = artifacts.artifacts.find(
              item => item.name === artifactName
            );

            if (!artifact || artifact.expired) {
              core.setFailed(
                `Artifact ${artifactName} is missing or expired.`
              );
              return;
            }

            core.setOutput('run_id', String(latest.id));
            core.setOutput('sha', latest.head_sha);
            core.setOutput('artifact_name', artifactName);
            core.setOutput('run_url', latest.html_url);

            core.info(`Build run: ${latest.html_url}`);
            core.info(`Build commit: ${latest.head_sha}`);
            core.info(`Artifact: ${artifactName}`);

      - name: Compare build commit with current master
        shell: bash
        env:
          BUILT_SHA: ${{ steps.latest.outputs.sha }}
        run: |
          set -euo pipefail

          MASTER_SHA="$(git rev-parse HEAD)"

          echo "===================================="
          echo "LATEST SUCCESSFUL BUILD"
          echo "===================================="
          echo "Build commit:  $BUILT_SHA"
          echo "Master commit: $MASTER_SHA"

          if [ "$BUILT_SHA" = "$MASTER_SHA" ]; then
            echo "RESULT: Build commit matches current master."
          else
            echo "RESULT: Current master has a different commit."
            echo
            echo "File differences between build and master:"
            git diff --name-status "$BUILT_SHA" "$MASTER_SHA"
          fi

      - name: Download existing build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.latest.outputs.artifact_name }}
          run-id: ${{ steps.latest.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded-artifact

      - name: Validate downloaded artifact
        shell: bash
        run: |
          set -euo pipefail

          test -s downloaded-artifact/api/POS.Api.dll
          test -s downloaded-artifact/web/POS.Web.dll

          echo "Existing build artifact successfully downloaded."
          echo "No compilation or publishing was performed."

      - name: Compare artifact with deployed applications
        shell: bash
        env:
          COMPARE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          REMOTE_DIR="/tmp/agrespos-compare-${COMPARE_ID}"

          SSH=(
            ssh
            -i /home/agres/.ssh/agrespos-test-deploy
            -o UserKnownHostsFile=/home/agres/.ssh/known_hosts
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=5
            -o StrictHostKeyChecking=yes
          )

          REMOTE="agresdeploy@192.168.0.142"

          cleanup() {
            "${SSH[@]}" "$REMOTE" \
              "rm -rf -- '$REMOTE_DIR'" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          "${SSH[@]}" "$REMOTE" \
            "umask 077 && mkdir -p '$REMOTE_DIR'"

          echo "Transferring existing artifact for comparison..."

          tar -C downloaded-artifact -czf - api web | \
            "${SSH[@]}" "$REMOTE" \
            "tar -xzf - -C '$REMOTE_DIR'"

          echo "Comparing published files with Rocky Linux..."

          "${SSH[@]}" "$REMOTE" "python3 - '$REMOTE_DIR'" <<'PY'
          import hashlib
          import os
          import sys

          base = sys.argv[1]

          def manifest(root, app):
              if not os.path.isdir(root):
                  raise SystemExit(f"Missing directory: {root}")

              files = {}

              for current, dirs, names in os.walk(root):
                  dirs.sort()
                  names.sort()

                  for name in names:
                      full = os.path.join(current, name)
                      relative = os.path.relpath(
                          full, root
                      ).replace(os.sep, "/")

                      # Preserve user-generated product images.
                      if (
                          app == "API"
                          and relative.startswith(
                              "wwwroot/uploads/products/"
                          )
                      ):
                          continue

                      with open(full, "rb") as f:
                          files[relative] = hashlib.sha256(
                              f.read()
                          ).hexdigest()

              return files

          def compare(app, source, deployed):
              expected = manifest(source, app)
              actual = manifest(deployed, app)

              missing = sorted(set(expected) - set(actual))
              extra = sorted(set(actual) - set(expected))
              different = sorted(
                  name
                  for name in set(expected) & set(actual)
                  if expected[name] != actual[name]
              )

              print()
              print("=" * 55)
              print(f"{app} COMPARISON")
              print("=" * 55)
              print(f"Artifact files: {len(expected)}")
              print(f"Server files:   {len(actual)}")

              sections = [
                  ("MISSING ON SERVER", missing),
                  ("EXTRA ON SERVER", extra),
                  ("CONTENT DIFFERENCES", different),
              ]

              for title, items in sections:
                  print(f"\n{title}: {len(items)}")
                  for item in items:
                      print(f"  {item}")

              if not missing and not extra and not different:
                  print("\nRESULT: ALL FILES MATCH")

          compare(
              "API",
              os.path.join(base, "api"),
              "/var/www/agres-api"
          )

          compare(
              "WEB",
              os.path.join(base, "web"),
              "/var/www/pos-web"
          )
          PY

      - name: Comparison complete
        run: echo "Comparison finished. No applications were deployed or restarted."
