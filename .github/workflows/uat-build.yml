
name: AgresPOS UAT - Build and Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agrespos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build POS.Api and POS.Web
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET information
        run: dotnet --info

      - name: Restore POS.Api
        run: dotnet restore POS.Api/POS.Api.csproj

      - name: Restore POS.Web
        run: dotnet restore POS.Web/POS.Web.csproj

      - name: Publish POS.Api
        run: dotnet publish POS.Api/POS.Api.csproj --configuration Release --no-restore --output artifacts/api

      - name: Publish POS.Web
        run: dotnet publish POS.Web/POS.Web.csproj --configuration Release --no-restore --output artifacts/web

      - name: Confirm publish outputs
        shell: bash
        run: |
          test -f artifacts/api/POS.Api.dll
          test -f artifacts/web/POS.Web.dll
          echo "API publish output:"
          find artifacts/api -maxdepth 1 -type f | sort | head -40
          echo "Web publish output:"
          find artifacts/web -maxdepth 1 -type f | sort | head -40

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: AgresPOS-UAT-publish-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
