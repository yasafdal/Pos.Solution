name: AgresPOS UAT - Build and Publish

on:
  workflow_dispatch:
    inputs:
      confirm_uat:
        description: 'Select DEPLOY-UAT to deploy the build to the UAT server; select NO to build only.'
        required: true
        type: choice
        options:
          - NO
          - DEPLOY-UAT
        default: NO

permissions:
  contents: read

concurrency:
  group: agrespos-uat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build POS.Api and POS.Web
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET information
        run: dotnet --info

      - name: Restore POS.Api
        run: dotnet restore POS.Api/POS.Api.csproj

      - name: Restore POS.Web
        run: dotnet restore POS.Web/POS.Web.csproj

      - name: Publish POS.Api
        run: dotnet publish POS.Api/POS.Api.csproj --configuration Release --no-restore --output artifacts/api

      - name: Publish POS.Web
        run: dotnet publish POS.Web/POS.Web.csproj --configuration Release --no-restore --output artifacts/web

      - name: Confirm publish outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/api/POS.Api.dll
          test -s artifacts/web/POS.Web.dll
          echo "API publish output:"
          find artifacts/api -maxdepth 1 -type f | sort | head -40
          echo "Web publish output:"
          find artifacts/web -maxdepth 1 -type f | sort | head -40

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: AgresPOS-UAT-publish-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  deploy-uat:
    name: Deploy to Rocky Linux UAT
    needs: build-and-publish
    if: >-
      inputs.confirm_uat == 'DEPLOY-UAT' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, agrespos-uat]
    timeout-minutes: 30

    steps:
      - name: Download published applications
        uses: actions/download-artifact@v8
        with:
          name: AgresPOS-UAT-publish-${{ github.sha }}
          path: downloaded-artifact

      - name: Validate artifacts and runner SSH files
        shell: bash
        run: |
          set -euo pipefail
          test -s downloaded-artifact/api/POS.Api.dll
          test -s downloaded-artifact/api/POS.Api.deps.json
          test -s downloaded-artifact/api/POS.Api.runtimeconfig.json
          test -s downloaded-artifact/web/POS.Web.dll
          test -s downloaded-artifact/web/POS.Web.deps.json
          test -s downloaded-artifact/web/POS.Web.runtimeconfig.json
          test -r /home/agres/.ssh/agrespos-test-deploy
          test -r /home/agres/.ssh/known_hosts
          chmod 600 /home/agres/.ssh/agrespos-test-deploy
          echo "Artifacts and SSH files are present."

      - name: Verify SSH connection to Rocky Linux
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i /home/agres/.ssh/agrespos-test-deploy \
            -o UserKnownHostsFile=/home/agres/.ssh/known_hosts \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=5 \
            -o StrictHostKeyChecking=yes \
            agresdeploy@192.168.0.142 'id'

      - name: Prepare official staging directories
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i /home/agres/.ssh/agrespos-test-deploy \
            -o UserKnownHostsFile=/home/agres/.ssh/known_hosts \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=5 \
            -o StrictHostKeyChecking=yes \
            agresdeploy@192.168.0.142 'set -eu
              API_STAGE=/home/agresdeploy/staging/official/api
              WEB_STAGE=/home/agresdeploy/staging/official/web
              test -d "$API_STAGE"
              test -d "$WEB_STAGE"
              find "$API_STAGE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
              find "$WEB_STAGE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            '

      - name: Transfer both publish outputs to staging
        shell: bash
        run: |
          set -euo pipefail
          tar -C downloaded-artifact -czf - api web | \
            ssh \
              -i /home/agres/.ssh/agrespos-test-deploy \
              -o UserKnownHostsFile=/home/agres/.ssh/known_hosts \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=5 \
              -o StrictHostKeyChecking=yes \
              agresdeploy@192.168.0.142 \
              'tar -xzf - -C /home/agresdeploy/staging/official'

      - name: Verify staged files and deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i /home/agres/.ssh/agrespos-test-deploy \
            -o UserKnownHostsFile=/home/agres/.ssh/known_hosts \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=5 \
            -o StrictHostKeyChecking=yes \
            agresdeploy@192.168.0.142 'set -eu
              test -s /home/agresdeploy/staging/official/api/POS.Api.dll
              test -s /home/agresdeploy/staging/official/web/POS.Web.dll
              sudo -n /usr/local/sbin/deploy-agrespos-official
            '
